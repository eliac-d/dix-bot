<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a6ff"/>
      <stop offset="1" stop-color="#7ff0ff"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .fill{animation:fill 2.2s cubic-bezier(.2,.8,.2,1) both}
      @keyframes fill{from{width:0}to{width:560px}}
      .blink{animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>
  <rect x="1" y="1" width="858" height="168" rx="10" fill="url(#panel)" stroke="#00c8ff" stroke-opacity=".45"/>
  <path d="M1 40H859" stroke="#00c8ff" stroke-opacity=".18"/>

  <text x="24" y="27" class="t" font-size="13" letter-spacing="4" fill="#7fdbff">PLAYER STATUS</text>
  <circle cx="826" cy="21" r="5" fill="#3cff9e" class="blink"/>
  <text x="812" y="26" text-anchor="end" class="t" font-size="12" letter-spacing="3" fill="#3cff9e">ONLINE</text>

  <text x="24" y="78" class="t" font-size="28" font-weight="700" letter-spacing="3" fill="#f2f8ff">Kiriti</text>
  <text x="124" y="78" class="t" font-size="14" letter-spacing="2" fill="#8aa0b8">LV. 8.0.1</text>

  <text x="250" y="66" class="t" font-size="12" letter-spacing="3" fill="#8aa0b8">HP</text>
  <rect x="276" y="56" width="560" height="14" rx="3" fill="#0a1220" stroke="#1f3350"/>
  <rect x="276" y="56" width="560" height="14" rx="3" fill="url(#hp)" class="fill"/>
  <text x="836" y="90" text-anchor="end" class="t" font-size="12" letter-spacing="2" fill="#9fb3c8">24 / 7</text>

  <g class="t" letter-spacing="2">
    <text x="24"  y="132" font-size="24" font-weight="700" fill="#00c8ff">150+</text>
    <text x="24"  y="152" font-size="11" fill="#8aa0b8">COMANDOS</text>
    <text x="230" y="132" font-size="24" font-weight="700" fill="#00c8ff">15</text>
    <text x="230" y="152" font-size="11" fill="#8aa0b8">CATEGORÍAS</text>
    <text x="420" y="132" font-size="24" font-weight="700" fill="#00c8ff">6</text>
    <text x="420" y="152" font-size="11" fill="#8aa0b8">PLATAFORMAS</text>
    <text x="620" y="132" font-size="24" font-weight="700" fill="#00c8ff">Node 22+</text>
    <text x="620" y="152" font-size="11" fill="#8aa0b8">MOTOR</text>
  </g>
</svg>
