<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blade1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="0.5" stop-color="#3a4560"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="blade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="0.5" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#3fb6e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00c8ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(340px)}}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .fade{animation:fade 1.6s ease-out both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="600" cy="160" rx="520" ry="150" fill="url(#glow)"/>

  <!-- espadas cruzadas: Elucidator (negra) y Dark Repulser (cian) -->
  <g opacity="0.3">
    <g transform="rotate(-30 585 160)">
      <rect x="330" y="153" width="560" height="14" rx="2" fill="url(#blade1)"/>
      <polygon points="890,153 930,160 890,167" fill="#2a3247"/>
      <rect x="295" y="146" width="10" height="28" fill="#0e121b" stroke="#00c8ff" stroke-opacity=".5"/>
      <rect x="240" y="155" width="56" height="10" fill="#0e121b"/>
    </g>
    <g transform="rotate(30 585 160)">
      <rect x="330" y="153" width="560" height="14" rx="2" fill="url(#blade2)"/>
      <polygon points="890,153 930,160 890,167" fill="#bff3ff"/>
      <rect x="295" y="146" width="10" height="28" fill="#cfefff"/>
      <rect x="240" y="155" width="56" height="10" fill="#9fdcf5"/>
    </g>
  </g>

  <!-- marco tipo interfaz -->
  <g stroke="#00c8ff" stroke-width="2" fill="none" opacity=".7">
    <path d="M30 70V30H90"/><path d="M1170 70V30H1110"/>
    <path d="M30 250V290H90"/><path d="M1170 250V290H1110"/>
  </g>

  <g class="fade">
    <text x="600" y="98" text-anchor="middle" class="t" font-size="15" letter-spacing="9" fill="#7fdbff">◆  SYSTEM  ·  LINK  START  ◆</text>
    <text x="600" y="172" text-anchor="middle" class="t" font-size="74" font-weight="700" letter-spacing="10" fill="#00c8ff" filter="url(#soft)" opacity=".55">KIRITI-BOT-MD</text>
    <text x="600" y="172" text-anchor="middle" class="t" font-size="74" font-weight="700" letter-spacing="10" fill="#f2f8ff">KIRITI-BOT-MD</text>
    <rect x="350" y="196" width="500" height="2" fill="url(#cyan)"/>
    <text x="600" y="230" text-anchor="middle" class="t" font-size="18" letter-spacing="5" fill="#9fb3c8">SISTEMA DE AUTOMATIZACIÓN PARA WHATSAPP</text>
  </g>

  <circle cx="600" cy="262" r="4" fill="#00c8ff" class="pulse"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#cyan)" class="scan" opacity=".5"/>
</svg>
